packages:
  - packages/*
allowBuilds:
  # The platform binary arrives as an optional dependency; the postinstall only re-verifies it.
  esbuild: false
  # Only the grammars' generated src/ is read (by the compiler, and by zig for the parity reference); their node
  # bindings go unused, so their install scripts need not run.
  tree-sitter-css: false
  tree-sitter-javascript: false
  tree-sitter-json: false
  tree-sitter-python: false
  tree-sitter-typescript: false
