name: release-extension

on:
  push:
    tags: [browser-v*]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Authenticate with both stores without uploading or submitting
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A store refuses a version it already has, and an unbumped tag would ship the old version's zips, so the
      # tag must name the version in packages/browser/package.json before anything is built or uploaded.
      - name: Check the tag matches the extension version
        if: github.event_name == 'push'
        run: |
          version=$(node -p 'require("./packages/browser/package.json").version')
          if [[ "$GITHUB_REF_NAME" != "browser-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/browser/package.json version $version. Bump the version to match and tag that commit browser-v<version>, or tag browser-v$version."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $version."

      - uses: ./.github/actions/setup

      - name: Package Chrome and Firefox extensions
        run: |
          pnpm --filter @hihyou/browser zip
          pnpm --filter @hihyou/browser zip:firefox

      - name: Create GitHub release and upload archives
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/browser/.output/*.zip --generate-notes --verify-tag

      - name: Submit to Chrome Web Store and Firefox Add-ons
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          dry_run=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            dry_run=(--dry-run)
          fi
          chrome_zip=$(find "$GITHUB_WORKSPACE/packages/browser/.output" -maxdepth 1 -name '*-chrome.zip' -print -quit)
          firefox_zip=$(find "$GITHUB_WORKSPACE/packages/browser/.output" -maxdepth 1 -name '*-firefox.zip' -print -quit)
          firefox_sources_zip=$(find "$GITHUB_WORKSPACE/packages/browser/.output" -maxdepth 1 -name '*-sources.zip' -print -quit)
          pnpm --filter @hihyou/browser exec wxt submit \
            --chrome-api-version v2 \
            --chrome-zip "$chrome_zip" \
            --firefox-zip "$firefox_zip" \
            --firefox-sources-zip "$firefox_sources_zip" \
            "${dry_run[@]}"
