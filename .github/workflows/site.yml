# Measures syntechs (conformance against the reference formatters, speed against them and oxfmt, highlighting
# speed against shiki), builds the
# website's scorecard from those results only, and publishes it to GitHub Pages.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Each measurement on its own runner, in parallel: the benches' timings are the product, so they never share a
  # CPU with each other or with conformance. Both benches run one language per runner, on the same inputs,
  # passes and tools as a run over every language; the site job merges them back into one file each.
  measure:
    strategy:
      matrix:
        include:
          - { id: conformance, script: fmt/conformance.node.js }
          - { id: bench-json, script: fmt/bench.node.js, language: json }
          - { id: bench-css, script: fmt/bench.node.js, language: css }
          - { id: bench-js, script: fmt/bench.node.js, language: js }
          - { id: bench-ts, script: fmt/bench.node.js, language: ts }
          - { id: bench-python, script: fmt/bench.node.js, language: python }
          - { id: bench-kotlin, script: fmt/bench.node.js, language: kotlin }
          - { id: highlight-json, script: highlight/bench.node.js, language: json }
          - { id: highlight-css, script: highlight/bench.node.js, language: css }
          - { id: highlight-html, script: highlight/bench.node.js, language: html }
          - { id: highlight-js, script: highlight/bench.node.js, language: js }
          - { id: highlight-ts, script: highlight/bench.node.js, language: ts }
          - { id: highlight-python, script: highlight/bench.node.js, language: python }
          - { id: highlight-kotlin, script: highlight/bench.node.js, language: kotlin }
          - { id: highlight-swift, script: highlight/bench.node.js, language: swift }
          - { id: highlight-yaml, script: highlight/bench.node.js, language: yaml }
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          fetch-inputs: "true"

      - name: Measure
        run: |
          mkdir -p "$RUNNER_TEMP/scorecard"
          node packages/syntechs/dist/${{ matrix.script }} ${{ matrix.language }} --json "$RUNNER_TEMP/scorecard/${{ matrix.id }}.json"
          cat "$RUNNER_TEMP/scorecard/${{ matrix.id }}.json"

      - name: Conformance summary
        if: matrix.id == 'conformance'
        run: cat packages/syntechs/conformance/README.md

      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-${{ matrix.id }}
          path: ${{ runner.temp }}/scorecard/${{ matrix.id }}.json
          if-no-files-found: error

  site:
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Where the website's data loader reads conformance.json, bench.json and highlight.json.
      - run: echo "SCORECARD_DIR=$RUNNER_TEMP/scorecard" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          pattern: scorecard-*
          merge-multiple: true
          path: ${{ runner.temp }}/measured

      # Each bench's one-language files back into the file a run over every language writes, groups in its order.
      - name: Merge
        run: |
          measured="$RUNNER_TEMP/measured"
          ls -l "$measured"
          mkdir -p "$SCORECARD_DIR"
          cp "$measured/conformance.json" "$SCORECARD_DIR/conformance.json"
          node packages/syntechs/dist/fmt/bench.node.js --merge "$measured"/bench-*.json --json "$SCORECARD_DIR/bench.json"
          node packages/syntechs/dist/highlight/bench.node.js --merge "$measured"/highlight-*.json --json "$SCORECARD_DIR/highlight.json"

      - name: Results
        run: ls -l "$SCORECARD_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: scorecard
          path: ${{ env.SCORECARD_DIR }}
          if-no-files-found: error

      - run: pnpm --filter website build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/website/docs/.vitepress/dist

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
